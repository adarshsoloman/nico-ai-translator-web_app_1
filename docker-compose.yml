version: '3.8'

services:
  nico-translator:
    build: .
    container_name: nico-ai-translator
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    env_file:
      - .env
    volumes:
      # Mount logs directory to persist logs
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
